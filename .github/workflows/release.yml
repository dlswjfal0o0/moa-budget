name: Release (TestFlight)

# 수동 실행 전용 — TestFlight 업로드는 매 커밋마다 나가는 게 아니라
# 릴리스하기로 결정했을 때 의도적으로 실행한다.
on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # macos-15's default Xcode built with the iOS 18.5 SDK — Apple now
      # requires iOS 26 SDK / Xcode 26+ for App Store Connect submissions.
      # "latest" picks the newest Xcode already installed on the runner
      # image (not a fresh download), so it should still have full
      # platform support unlike the older side-installed versions we hit
      # trouble with earlier.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - run: node scripts/sync-version.js

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios/App

      - name: Build and upload to TestFlight
        working-directory: ios/App
        env:
          # fastlane has been warning "requires your locale to be set to
          # UTF-8" in every run — turns out to matter: without a UTF-8
          # locale, Ruby's default external encoding is US-ASCII, which
          # crashes on the Korean PRODUCT_NAME ("모아 moa") anywhere the
          # Fastfile reads/writes the pbxproj as text (e.g. via the
          # xcodeproj gem). Set at job-start so it's in effect before the
          # Ruby process launches.
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
          IOS_DIST_CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}
          IOS_DIST_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          IOS_CI_KEYCHAIN_PASSWORD: ${{ secrets.IOS_CI_KEYCHAIN_PASSWORD }}
        run: bundle exec fastlane beta

      # Keep the built IPA even if the upload step fails, so it can be
      # downloaded and tried manually via Transporter to isolate whether
      # a failure is CI/altool-specific or an account/cert/profile issue.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: App-ipa
          path: ios/App/build/App.ipa
          if-no-files-found: ignore
